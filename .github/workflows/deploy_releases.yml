name: Deploy Releases

# Trigger the workflow on pushes to tags matching 'v*.*.*'
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Set VERSION from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Using build version: $RELEASE_TAG"
      - name: Replace BUILD_VERSION with version
        run: |
          sed -i "s/BUILD_VERSION/${VERSION}/g" ESP32/Digifiz/main/data/digifiz_ws_connect.html
          sed -i "s/BUILD_VERSION/${VERSION}/g" A2560_BoardR2/Digifiz/protocol.cpp
    # --- Arduino Build ---
      # --- Install Arduino CLI ---
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$HOME/bin" >> $GITHUB_PATH  # Add Arduino CLI to PATH
          echo "/home/runner/work/DigifizReplica/DigifizReplica/bin" >> $GITHUB_PATH  # Add Arduino CLI to PATH
          echo "/home/runner/work/DigifizReplica/bin" >> $GITHUB_PATH  # Add Arduino CLI to PATH
      # --- Verify Arduino CLI Installation ---
      - name: Check Arduino CLI Version
        run: arduino-cli version
      # --- Install Arduino AVR Core ---
      - name: Install Arduino AVR Core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      # --- Configure Arduino CLI ---
      - name: Create Arduino CLI Configuration
        run: |
          mkdir -p ~/.arduino15
          cat <<EOF > ~/.arduino15/arduino-cli.yaml
          board_manager:
            additional_urls: []
          daemon:
            port: "50051"
          logging:
            file: ""
            format: text
            level: info
          metrics:
            addr: ""
            enabled: false
          sketchbook_path: "$HOME/Arduino"
          allow_unsafe_install: true  # Enable --git-url and --zip-path
          EOF
      # --- Backup Original setup.h ---
      - name: Backup Original setup.h
        run: mv A2560_BoardR2/Digifiz/setup.h A2560_BoardR2/Digifiz/setup.h.orig

      # --- Define Variants ---
      - name: Set Variant List
        run: echo "VARIANTS=setup_audi_red setup_audi_green setup_audi_green_uiod setup_g2 setup_g2_uk setup_g2_usa setup_g2_diesel" >> $GITHUB_ENV

      # --- Install Dependencies (Arduino Libraries) ---
      - name: Install Required Arduino Libraries
        run: |
          arduino-cli lib install "RTCLib"
          arduino-cli lib install "MedianFilterLib2"
          arduino-cli lib install "SparkFun External EEPROM Arduino Library"
          arduino-cli lib install "Adafruit BusIO"

      # --- Loop and Build Each Variant ---
      - name: Compile All Variants
        run: |
          for VARIANT in $VARIANTS; do
            echo "Building $VARIANT..."
            cp A2560_BoardR2/Digifiz/${VARIANT}.h A2560_BoardR2/Digifiz/setup.h
            arduino-cli compile --fqbn arduino:avr:mega A2560_BoardR2/Digifiz/ --output-dir build/$VARIANT
          done

      # --- Upload All Arduino Variants as Artifacts ---
      - name: Collect Arduino Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digifiz-firmware
          path: build/
          compression-level: 0  # Adjust for speed vs. size (0 = fastest, 9 = smallest)
          if-no-files-found: error  # Fails if no firmware is generated
     # --- Zip All Artifacts ---
      - name: Zip All Artifacts
        run: |
          # Create a zip file of all the artifacts in the build directory
          zip -r build/digifiz-firmware.zip build/*
          
      # --- Digifiz Next ESP-IDF Build ---
      - name: Select Digifiz Next setup
        run: cp ESP32/Digifiz/main/setup_dr_next.h ESP32/Digifiz/main/setup.h

      - name: Set up ESP-IDF and Build
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: v5.2.1
          target: esp32s3
          path: 'ESP32/Digifiz/'

      - name: Collect Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          compression-level: 0  # Adjust for speed vs. size (0 = fastest, 9 = smallest)
          if-no-files-found: error  # Fails if no firmware is generated
          path: |
            ESP32/Digifiz/build/*.bin
            ESP32/Digifiz/build/bootloader/*.bin
            ESP32/Digifiz/build/partition_table/*.bin
            ESP32/Digifiz/build/*.elf
            
     
      # Preserve Digifiz Next binaries before switching the shared setup.h.
      - name: Preserve Digifiz Next Build
        run: |
          mkdir -p release/digifiz-next
          cp ESP32/Digifiz/build/Digifiz.bin release/digifiz-next/
          cp ESP32/Digifiz/build/Digifiz.elf release/digifiz-next/
          cp ESP32/Digifiz/build/bootloader/bootloader.bin release/digifiz-next/
          cp ESP32/Digifiz/build/partition_table/partition-table.bin release/digifiz-next/partition_table.bin
          cp ESP32/Digifiz/build/ota_data_initial.bin release/digifiz-next/

      # The Docker action owns its generated files. Keep the Next build intact
      # and use an independent directory instead of deleting it on the host.
      - name: Select ReFIZ setup
        run: |
          cp ESP32/Digifiz/main/setup_refiz.h ESP32/Digifiz/main/setup.h
          sed -i 's/Digifiz Server/ReFIZ Server/g' ESP32/Digifiz/main/data/digifiz_ws_connect.html

      - name: Build ReFIZ firmware
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: v5.2.1
          target: esp32s3
          path: 'ESP32/Digifiz/'
          command: idf.py -B build-refiz build

      - name: Package ReFIZ firmware
        run: |
          mkdir -p release/refiz
          cp ESP32/Digifiz/build-refiz/Digifiz.bin release/refiz/
          cp ESP32/Digifiz/build-refiz/Digifiz.elf release/refiz/
          cp ESP32/Digifiz/build-refiz/bootloader/bootloader.bin release/refiz/
          cp ESP32/Digifiz/build-refiz/partition_table/partition-table.bin release/refiz/
          cp ESP32/Digifiz/build-refiz/ota_data_initial.bin release/refiz/
          (cd release/refiz && zip -9 ../refiz-firmware.zip *)

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            release/digifiz-next/Digifiz.bin
            release/digifiz-next/bootloader.bin
            release/digifiz-next/partition_table.bin
            release/digifiz-next/ota_data_initial.bin
            release/digifiz-next/Digifiz.elf
            build/digifiz-firmware.zip
            release/refiz-firmware.zip
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          printf 'Automated release for %s.\n' "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          # An existing release can remain after its tag is deleted. Stage both
          # new releases and replacements as drafts until every asset is uploaded.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Release $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest \
            --target "$GITHUB_SHA" --title "Release $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
